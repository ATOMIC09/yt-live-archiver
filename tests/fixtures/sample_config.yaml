# Sample configuration for use in test fixtures
application:
  data_dir: /tmp/yt-archiver-test/data
  database: /tmp/yt-archiver-test/data/archive.db

youtube:
  poll_interval_seconds: 5
  wait_for_video_seconds: 10
  live_from_start: true

recording:
  working_dir: /tmp/yt-archiver-test/data/working
  failed_dir: /tmp/yt-archiver-test/data/failed
  format: "bv*+ba/best"
  container: mkv

verification:
  require_video: true
  require_audio: true
  run_decode_test: false
  minimum_duration_seconds: 5.0

processing:
  max_parallel_uploads: 1

google_drive:
  enabled: false
  credentials_file: /tmp/test-credentials.json
  shared_drive_id: ""
  folder_id: ""
  chunk_size_mb: 64

webhook:
  enabled: false
  url: ""
  timeout_seconds: 5
  max_attempts: 3

cleanup:
  require_webhook: false

channels:
  - id: test_channel
    name: Test Channel
    url: https://www.youtube.com/@TestChannel/live
    enabled: true
