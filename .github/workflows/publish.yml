name: Publish Docker Image

on:
  push:
    tags:
      - "v*.*.*"   # Triggers on version tags: v2.0.0, v2.1.0, etc.

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=yt-live-archiver
            org.opencontainers.image.description=Automated YouTube livestream archiver with Google Drive upload and Discord notifications

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Docker Image

            ```bash
            docker pull ghcr.io/atomic09/yt-live-archiver:${{ github.ref_name }}
            ```

            Or always use `latest`:
            ```bash
            docker pull ghcr.io/atomic09/yt-live-archiver:latest
            ```

            ## Quick Start

            ```bash
            docker run -d \
              --name yt-live-archiver \
              --restart unless-stopped \
              -v /your/data:/data \
              -e CHANNELS="id:Name:https://www.youtube.com/@handle/live" \
              -e WEBHOOK_ENABLED=true \
              -e WEBHOOK_URL="https://discord.com/api/webhooks/..." \
              ghcr.io/atomic09/yt-live-archiver:${{ github.ref_name }}
            ```

            See the [README](https://github.com/ATOMIC09/yt-live-archiver#readme) for the full environment variable reference.
